networks:
  dev:
    name: dev

volumes:
  pgadmin_data:

services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    ports:
      - "0.0.0.0:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-dev@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set PGADMIN_DEFAULT_PASSWORD in workstation/dev/.env}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - dev
    # Postgres runs in the Docker LXC at <docker-lxc-ip>:5432
    # Add it as a server in pgAdmin using that address
