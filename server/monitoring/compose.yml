networks:
  monitoring:
    name: monitoring

volumes:
  grafana_data:
  portainer_data:
  uptimekuma_data:
    name: ${UPTIMEKUMA_DATA_VOLUME:-monitoring_uptimekuma_migrated_20261018}

services:
  grafana:
    image: grafana/grafana:latest@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    container_name: grafana
    restart: unless-stopped
    ports:
      - "0.0.0.0:3002:3000"
    environment:
      TZ: America/New_York
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring

  portainer:
    image: portainer/portainer-ce:latest@sha256:3609c307943bca8e5c492f69ddd6965df177208b50678a4cff28391c8dd4e96e
    container_name: portainer
    restart: unless-stopped
    ports:
      - "0.0.0.0:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - monitoring

  uptime-kuma:
    image: louislam/uptime-kuma:2.2.1@sha256:7337368a77873f159435de9ef09567f68c31285ed5f951dec36256c4b267ee44
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "0.0.0.0:3003:3001"
    volumes:
      - uptimekuma_data:/app/data
    networks:
      - monitoring
