networks:
  media:
    name: media

volumes:
  jellyfin_data:
    name: ${JELLYFIN_DATA_VOLUME:-media_jellyfin_data_migrated_20261019}
  jellyfin_config:
    name: ${JELLYFIN_CONFIG_VOLUME:-media_jellyfin_config_migrated_20261019}
  jellyfin_cache:
    name: ${JELLYFIN_CACHE_VOLUME:-media_jellyfin_cache_migrated_20261019}
  jellyfin_logs:
    name: ${JELLYFIN_LOGS_VOLUME:-media_jellyfin_logs_migrated_20261019}

services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.8
    container_name: jellyfin
    restart: unless-stopped
    # Refuse to scan the underlying empty directory if the SMB mount is absent.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if ! grep -qs ' /mnt/router-share cifs ' /proc/mounts; then
          echo 'Jellyfin requires the mounted router media share.' >&2
          exit 1
        fi
        exec /jellyfin/jellyfin
    ports:
      - "0.0.0.0:8096:8096"
    environment:
      TZ: America/New_York
      JELLYFIN_DATA_DIR: /var/lib/jellyfin
      JELLYFIN_CONFIG_DIR: /etc/jellyfin
      JELLYFIN_CACHE_DIR: /var/cache/jellyfin
      JELLYFIN_LOG_DIR: /var/log/jellyfin
    volumes:
      - jellyfin_data:/var/lib/jellyfin
      - jellyfin_config:/etc/jellyfin
      - jellyfin_cache:/var/cache/jellyfin
      - jellyfin_logs:/var/log/jellyfin
      # Require the real mounted media share; don't create an empty host directory.
      # The retired /mnt/media-share library root is not mapped here.
      - type: bind
        source: /mnt/router-share
        target: /mnt/router-share
        read_only: true
        bind:
          create_host_path: false
    networks:
      - media
    # --- Uncomment for Intel Quick Sync hardware transcoding ---
    # devices:
    #   - /dev/dri:/dev/dri
