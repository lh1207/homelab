server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Pretty-URL resolution matching Porkbun's static host behavior
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # .mjs is absent from nginx default mime.types; required for Vue ES module imports
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
