volumes:
  staging_site:

services:
  ftp:
    image: stilliard/pure-ftpd:hardened@sha256:1d15f8091b18d399178acc47559b9328c3deecca732d52df96e65303d6a8a966
    container_name: staging-ftp
    network_mode: host
    environment:
      FTP_USER_NAME: ${FTP_USER_NAME:-staging}
      FTP_USER_PASS: ${FTP_USER_PASS:?set FTP_USER_PASS in server/staging/.env}
      FTP_USER_HOME: /srv/site
      PUBLICHOST: ${OPTIPLEX_IP:?set OPTIPLEX_IP in server/staging/.env}
    volumes:
      - staging_site:/srv/site
    restart: unless-stopped

  web:
    image: nginx:alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
    container_name: staging-web
    ports:
      - "0.0.0.0:8090:80"
    volumes:
      - staging_site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
