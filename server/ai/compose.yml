networks:
  ai:
    name: ai

volumes:
  openwebui_data:

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?set OLLAMA_BASE_URL in server/ai/.env}  # Ollama baremetal on the Mac
    volumes:
      - openwebui_data:/app/backend/data
    networks:
      - ai
