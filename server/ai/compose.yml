networks:
  ai:
    name: ai

volumes:
  openwebui_data:

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main@sha256:59b912d4246103c7285de0e9a5f2f6586614c06b4c4e46edc51a8f29e7b099a5
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "0.0.0.0:3000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?set OLLAMA_BASE_URL in server/ai/.env}
    volumes:
      - openwebui_data:/app/backend/data
    networks:
      - ai
