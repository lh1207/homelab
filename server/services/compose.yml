networks:
  services:
    name: services

volumes:
  vaultwarden_data:
  gitea_data:

services:
  vaultwarden:
    image: vaultwarden/server:latest@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
    container_name: vaultwarden
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:80"
    environment:
      WEBSOCKET_ENABLED: "true"
    volumes:
      - vaultwarden_data:/data
    networks:
      - services

  gitea:
    image: gitea/gitea:latest@sha256:8967bf9deaf3c5c4adae13519436dc1b20c646ac83fe37ae810c933a1045227d
    container_name: gitea
    restart: unless-stopped
    ports:
      - "0.0.0.0:3001:3000"
      - "0.0.0.0:2222:22"
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__server__SSH_PORT: 2222
    volumes:
      - gitea_data:/data
    networks:
      - services
