networks:
  services:
    name: services

volumes:
  vaultwarden_data:
  gitea_data:

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:80"
    environment:
      WEBSOCKET_ENABLED: "true"
    volumes:
      - vaultwarden_data:/data
    networks:
      - services

  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    restart: unless-stopped
    ports:
      - "0.0.0.0:3001:3000"
      - "0.0.0.0:2222:22"
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__server__SSH_PORT: 2222
    volumes:
      - gitea_data:/data
    networks:
      - services
