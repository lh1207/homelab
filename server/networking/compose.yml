volumes:
  caddy_data:
  caddy_config:

services:
  caddy:
    image: caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    container_name: caddy
    restart: unless-stopped
    network_mode: host
    environment:
      PGADMIN_UPSTREAM: ${PGADMIN_UPSTREAM:?set PGADMIN_UPSTREAM in server/networking/.env}
      OLLAMA_UPSTREAM: ${OLLAMA_UPSTREAM:?set OLLAMA_UPSTREAM in server/networking/.env}
      BOOKSTACK_UPSTREAM: ${BOOKSTACK_UPSTREAM:?set BOOKSTACK_UPSTREAM in server/networking/.env}
      PIHOLE_UPSTREAM: ${PIHOLE_UPSTREAM:?set PIHOLE_UPSTREAM in server/networking/.env}
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - caddy_data:/data
      - caddy_config:/config
