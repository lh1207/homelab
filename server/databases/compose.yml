networks:
  databases:
    name: databases

volumes:
  postgres_data:
  redis_data:

services:
  postgres:
    image: postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
    container_name: postgres
    restart: unless-stopped
    ports:
      - "0.0.0.0:5432:5432"  # Exposed to LAN for pgAdmin on Mac
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in server/databases/.env}
      POSTGRES_DB: ${POSTGRES_DB:-localdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - databases

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    container_name: redis
    restart: unless-stopped
    ports:
      - "0.0.0.0:6379:6379"  # Exposed to LAN if needed by local dev
    volumes:
      - redis_data:/data
    networks:
      - databases
