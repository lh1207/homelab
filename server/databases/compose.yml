networks:
  databases:
    name: databases

volumes:
  postgres_data:
  redis_data:

services:
  postgres:
    image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    container_name: postgres
    restart: unless-stopped
    ports:
      - "0.0.0.0:5432:5432"  # Exposed to LAN for pgAdmin on Mac
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in server/databases/.env}
      POSTGRES_DB: ${POSTGRES_DB:-localdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - databases

  redis:
    image: redis:7-alpine@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7
    container_name: redis
    restart: unless-stopped
    ports:
      - "0.0.0.0:6379:6379"  # Exposed to LAN if needed by local dev
    volumes:
      - redis_data:/data
    networks:
      - databases
