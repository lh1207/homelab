services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f
    container_name: homepage
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Match the image check explicitly so Compose scanners can see it.
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider -Y off http://127.0.0.1:$$PORT/api/healthcheck || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    ports:
      - "127.0.0.1:3004:3000"
      - "${DASHBOARD_BIND_IP:?set DASHBOARD_BIND_IP in server/dashboard/.env}:3004:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: America/New_York
      LOG_TARGETS: stdout
      HOMEPAGE_ALLOWED_HOSTS: homepage.localhost,docker.homepage
      HOMEPAGE_VAR_PROXMOX_URL: ${HOMEPAGE_VAR_PROXMOX_URL:?set the Proxmox URL}
      HOMEPAGE_VAR_HOMEASSISTANT_URL: ${HOMEPAGE_VAR_HOMEASSISTANT_URL:?set the Home Assistant URL}
    volumes:
      - type: bind
        source: ./config
        target: /app/config
        bind:
          create_host_path: false
