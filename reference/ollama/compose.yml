networks:
  ai:
    name: ai

volumes:
  ollama_data:

services:
  ollama:
    image: ollama/ollama:latest@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    container_name: ollama
    restart: unless-stopped
    ports:
      - "0.0.0.0:11434:11434"  # LAN-exposed so Open WebUI on Optiplex can reach it
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai
