networks:
  ai:
    name: ai

volumes:
  ollama_data:

services:
  ollama:
    image: ollama/ollama:latest@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
    container_name: ollama
    restart: unless-stopped
    ports:
      - "0.0.0.0:11434:11434"  # LAN-exposed so Open WebUI on Optiplex can reach it
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai
