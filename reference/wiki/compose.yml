networks:
  wiki:
    name: wiki

volumes:
  bookstack_data:
    name: ${BOOKSTACK_DATA_VOLUME:-wiki_bookstack_migrated_20261018}
  bookstack_db_data:
    name: ${BOOKSTACK_DB_VOLUME:-wiki_bookstack_db_migrated_20261018}

services:
  bookstack:
    image: lscr.io/linuxserver/bookstack:latest
    container_name: bookstack
    restart: unless-stopped
    ports:
      - "0.0.0.0:6875:80"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/New_York
      APP_KEY: ${APP_KEY:?set APP_KEY in reference/wiki/.env}
      APP_URL: https://bookstack.localhost
      DB_HOST: bookstack-db
      DB_PORT: 3306
      DB_USERNAME: bookstack
      DB_PASSWORD: ${BOOKSTACK_DB_PASS:?set BOOKSTACK_DB_PASS in reference/wiki/.env}
      DB_DATABASE: bookstack
    volumes:
      - bookstack_data:/config
    networks:
      - wiki
    depends_on:
      - bookstack-db

  bookstack-db:
    image: lscr.io/linuxserver/mariadb:latest
    container_name: bookstack-db
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/New_York
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in reference/wiki/.env}
      MYSQL_DATABASE: bookstack
      MYSQL_USER: bookstack
      MYSQL_PASSWORD: ${BOOKSTACK_DB_PASS:?set BOOKSTACK_DB_PASS in reference/wiki/.env}   # must match bookstack DB_PASSWORD
    volumes:
      - bookstack_db_data:/config
    networks:
      - wiki
