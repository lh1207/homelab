name: security

# Layers 3 of the secret/vuln defense (see README "Security"). Secret + config
# scans run on every push/PR; the heavier image CVE scan runs weekly and on demand.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — weekly image CVE scan
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # upload SARIF to the Security tab

jobs:
  dashboard-smoke:
    name: Homepage hardened startup
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DASHBOARD_BIND_IP: 127.0.0.2
      HOMEPAGE_VAR_PROXMOX_URL: https://proxmox.invalid:8006
      HOMEPAGE_VAR_HOMEASSISTANT_URL: http://homeassistant.invalid:8123
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start an isolated dashboard and check HTTP access
        shell: bash
        run: |
          test_dir="$(mktemp -d)"
          cp server/dashboard/compose.yml "$test_dir/compose.yml"
          cp -R server/dashboard/config "$test_dir/config"
          compose=(docker compose --project-name dashboard-smoke --env-file /dev/null -f "$test_dir/compose.yml")
          cleanup() {
            "${compose[@]}" logs --no-color
            "${compose[@]}" down
            rm -rf "$test_dir"
          }
          trap cleanup EXIT
          "${compose[@]}" up --detach --wait --wait-timeout 120
          "${compose[@]}" exec -T homepage sh -c 'grep -Eq "^CapEff:[[:space:]]+0+$" /proc/1/status && grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/1/status'
          for dashboard_host in homepage.localhost docker.homepage; do
            "${compose[@]}" exec -T homepage wget -q -O /dev/null --header="Host: $dashboard_host" http://127.0.0.1:3000
          done

  secret-scan:
    name: gitleaks (secrets, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the entire history, not just the diff
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # required for PR scans
          GITLEAKS_CONFIG: .gitleaks.toml

  env-guard:
    name: no real .env tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fail if any non-example .env is tracked
        run: |
          tracked="$(git ls-files | grep -E '\.env(\..*)?$' | grep -v '\.env\.example$' || true)"
          if [ -n "$tracked" ]; then
            echo "::error::Real .env file(s) are tracked in git:"
            echo "$tracked"
            exit 1
          fi
          echo "OK: no real .env files tracked."

  config-scan:
    name: kics (compose misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # KICS has dedicated Docker Compose queries (Trivy's config scanner does not
      # support compose). Report-only: ignore_on_exit=results so intentional homelab
      # choices (host networking, exposed DB ports) surface in the Security tab
      # without blocking pushes.
      - name: KICS Docker Compose scan
        uses: checkmarx/kics-github-action@4a16c2130b02104dc2624c133d5224080e7cc49b # v2.2.1
        with:
          path: "."
          type: DockerCompose
          output_formats: sarif
          output_path: kics-results/
          ignore_on_exit: results
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: kics-results/results.sarif
          category: kics-docker-compose

  image-scan:
    name: trivy image CVE scan
    # Scan the same immutable references used by Compose, including reference stacks.
    # Heavy (pulls 19 images): only weekly cron or manual run, not every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6 # fewer concurrent Docker Hub pulls — avoids the i/o timeouts seen at 18-wide
      matrix:
        include:
          - name: caddy:2-alpine
            image: caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
          - name: dpage/pgadmin4:latest
            image: dpage/pgadmin4:latest@sha256:3591b3d02910dcd817dec6fcaa681c278ba6966945283dd0ea0042731c330c83
          - name: ghcr.io/gethomepage/homepage:v2.7.0
            image: ghcr.io/gethomepage/homepage:v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f
          - name: ghcr.io/open-webui/open-webui:main
            image: ghcr.io/open-webui/open-webui:main@sha256:59b912d4246103c7285de0e9a5f2f6586614c06b4c4e46edc51a8f29e7b099a5
          - name: gitea/gitea:latest
            image: gitea/gitea:latest@sha256:8967bf9deaf3c5c4adae13519436dc1b20c646ac83fe37ae810c933a1045227d
          - name: grafana/grafana:latest
            image: grafana/grafana:latest@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
          - name: homebridge/homebridge:latest
            image: homebridge/homebridge:latest@sha256:49e10e19bce69de56b0b77c724f317858dcd32e17cd9f379833660b1af26dbd5
          - name: jellyfin/jellyfin:12.4
            image: jellyfin/jellyfin:12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
          - name: louislam/uptime-kuma:2.5.9
            image: louislam/uptime-kuma:2.5.9@sha256:e88415a90dd2f7efecdbc18de0490aff292764a3ac471531bf1d0481725591bd
          - name: lscr.io/linuxserver/bookstack:latest
            image: lscr.io/linuxserver/bookstack:latest@sha256:2ece67eeffcc8601f2c3d44c77d787ce49b1e0becfcb2c4bd8ce9b69fa8393ed
          - name: lscr.io/linuxserver/mariadb:latest
            image: lscr.io/linuxserver/mariadb:latest@sha256:cc9c523dead7690487d5892419b5c513c78bf398fe03b115e43a652ab75a237c
          - name: nginx:alpine
            image: nginx:alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
          - name: ollama/ollama:latest
            image: ollama/ollama:latest@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
          - name: pihole/pihole:latest
            image: pihole/pihole:latest@sha256:30f803ad5dd60ff96cc0a63008a2e9271af481c1b0399a182192b2e91152c1f9
          - name: portainer/portainer-ce:latest
            image: portainer/portainer-ce:latest@sha256:3609c307943bca8e5c492f69ddd6965df177208b50678a4cff28391c8dd4e96e
          - name: postgres:16
            image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
          - name: redis:7-alpine
            image: redis:7-alpine@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7
          - name: stilliard/pure-ftpd:hardened
            image: stilliard/pure-ftpd:hardened@sha256:1d15f8091b18d399178acc47559b9328c3deecca732d52df96e65303d6a8a966
          - name: vaultwarden/server:latest
            image: vaultwarden/server:latest@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
    steps:
      - name: Trivy scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true # a transient registry pull failure shouldn't fail the run
        with:
          image-ref: ${{ matrix.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true # only actionable (fixable) CVEs
          vuln-type: os,library
          exit-code: "0" # report-only — these are upstream images we don't build
          format: sarif
          output: trivy-results.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: hashFiles('trivy-results.sarif') != '' # only when the scan actually produced results
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-${{ matrix.name }} # stable across digest updates; unique per image
