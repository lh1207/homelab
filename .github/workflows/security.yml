name: security

# Layers 3 of the secret/vuln defense (see README "Security"). Secret + config
# scans run on every push/PR; the heavier image CVE scan runs weekly and on demand.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — weekly image CVE scan
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # upload SARIF to the Security tab

jobs:
  dashboard-smoke:
    name: Homepage hardened startup
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DASHBOARD_BIND_IP: 127.0.0.2
      HOMEPAGE_VAR_PROXMOX_URL: https://proxmox.invalid:8006
      HOMEPAGE_VAR_HOMEASSISTANT_URL: http://homeassistant.invalid:8123
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Start an isolated dashboard and check HTTP access
        shell: bash
        run: |
          test_dir="$(mktemp -d)"
          cp server/dashboard/compose.yml "$test_dir/compose.yml"
          cp -R server/dashboard/config "$test_dir/config"
          compose=(docker compose --project-name dashboard-smoke --env-file /dev/null -f "$test_dir/compose.yml")
          cleanup() {
            "${compose[@]}" logs --no-color
            "${compose[@]}" down
            rm -rf "$test_dir"
          }
          trap cleanup EXIT
          "${compose[@]}" up --detach --wait --wait-timeout 120
          "${compose[@]}" exec -T homepage sh -c 'grep -Eq "^CapEff:[[:space:]]+0+$" /proc/1/status && grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/1/status'
          "${compose[@]}" exec -T homepage wget -q -O /dev/null --header='Host: homepage.localhost' http://127.0.0.1:3000

  secret-scan:
    name: gitleaks (secrets, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # scan the entire history, not just the diff
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # required for PR scans
          GITLEAKS_CONFIG: .gitleaks.toml

  env-guard:
    name: no real .env tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Fail if any non-example .env is tracked
        run: |
          tracked="$(git ls-files | grep -E '\.env(\..*)?$' | grep -v '\.env\.example$' || true)"
          if [ -n "$tracked" ]; then
            echo "::error::Real .env file(s) are tracked in git:"
            echo "$tracked"
            exit 1
          fi
          echo "OK: no real .env files tracked."

  config-scan:
    name: kics (compose misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # KICS has dedicated Docker Compose queries (Trivy's config scanner does not
      # support compose). Report-only: ignore_on_exit=results so intentional homelab
      # choices (host networking, exposed DB ports) surface in the Security tab
      # without blocking pushes.
      - name: KICS Docker Compose scan
        uses: checkmarx/kics-github-action@05aa5eb70eede1355220f4ca5238d96b397e30a6 # v2.1.20
        with:
          path: "."
          type: DockerCompose
          output_formats: sarif
          output_path: kics-results/
          ignore_on_exit: results
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@d77b13a0df3134d64a457ea9003f600b09fa1c8a # v3
        if: always()
        with:
          sarif_file: kics-results/results.sarif
          category: kics-docker-compose

  image-scan:
    name: trivy image CVE scan
    # Heavy (pulls 18 images): only weekly cron or manual run, not every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6 # fewer concurrent Docker Hub pulls — avoids the i/o timeouts seen at 18-wide
      matrix:
        image:
          - caddy:2-alpine
          - dpage/pgadmin4:latest
          - ghcr.io/open-webui/open-webui:main
          - gitea/gitea:latest
          - grafana/grafana:latest
          - homebridge/homebridge:latest
          - jellyfin/jellyfin:latest
          - louislam/uptime-kuma:latest
          - lscr.io/linuxserver/bookstack:latest
          - lscr.io/linuxserver/mariadb:latest
          - nginx:alpine
          - ollama/ollama:latest
          - pihole/pihole:latest
          - portainer/portainer-ce:latest
          - postgres:16
          - redis:7-alpine
          - stilliard/pure-ftpd:hardened
          - vaultwarden/server:latest
    steps:
      - name: Trivy scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true # a transient registry pull failure shouldn't fail the run
        with:
          image-ref: ${{ matrix.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true # only actionable (fixable) CVEs
          vuln-type: os,library
          exit-code: "0" # report-only — these are upstream images we don't build
          format: sarif
          output: trivy-results.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@d77b13a0df3134d64a457ea9003f600b09fa1c8a # v3
        if: hashFiles('trivy-results.sarif') != '' # only when the scan actually produced results
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-${{ matrix.image }} # unique per image so uploads don't clobber
